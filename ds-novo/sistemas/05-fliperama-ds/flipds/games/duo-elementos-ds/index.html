<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07121e">
  <title>Duo Elementos DS</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="game-shell" class="game-shell">
    <canvas id="game" width="960" height="540" aria-label="Duo Elementos DS"></canvas>
    <section class="hud" aria-live="polite">
      <div class="objective"><span id="level-label">FASE 1/8</span><strong id="level-title">Estação de Sincronia</strong><small id="objective-text">Leve os dois elementos às saídas.</small></div>
      <div class="status"><span id="mode-label">SOLO</span><span id="active-label">ATIVO: ÍGNEO</span><span id="shard-label">NÚCLEOS 0/0</span></div>
    </section>
    <div id="toast" class="toast" hidden></div>
    <div id="pause" class="pause" hidden><strong>PAUSADO</strong><span>P ou botão de pausa para continuar.</span></div>
    <div id="touch-controls" class="touch-controls" hidden>
      <div class="touch-player p1" aria-label="Controles do jogador 1">
        <button data-action="p1-left" aria-label="Jogador 1 esquerda">◀</button>
        <button data-action="p1-jump" aria-label="Jogador 1 pular">▲</button>
        <button data-action="p1-right" aria-label="Jogador 1 direita">▶</button>
      </div>
      <button id="touch-switch" class="switch" data-action="switch-player" aria-label="Trocar personagem">TROCAR</button>
      <div class="touch-player p2" aria-label="Controles do jogador 2">
        <button data-action="p2-left" aria-label="Jogador 2 esquerda">◀</button>
        <button data-action="p2-jump" aria-label="Jogador 2 pular">▲</button>
        <button data-action="p2-right" aria-label="Jogador 2 direita">▶</button>
      </div>
    </div>
  </main>
  <script type="module" src="./game.js"></script>
</body>
</html>
