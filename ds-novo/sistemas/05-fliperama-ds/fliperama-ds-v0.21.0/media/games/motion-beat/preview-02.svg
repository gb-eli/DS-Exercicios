<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-label="Painel educacional do Motion Beat DS"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071629"/><stop offset="1" stop-color="#170b2b"/></linearGradient></defs><rect width="900" height="540" fill="url(#g)"/><text x="58" y="65" fill="#49e7ff" font-family="monospace" font-size="20" font-weight="800">LÓGICA DO RITMO</text><text x="58" y="108" fill="#fff" font-family="Arial" font-size="34" font-weight="900">BPM + FILA DE EVENTOS + JANELA DE ACERTO</text><g transform="translate(58 145)"><rect width="245" height="145" rx="18" fill="#07172a" stroke="#49e7ff"/><text x="24" y="38" fill="#8ff2ff" font-family="monospace" font-size="17">TEMPO ALVO</text><text x="24" y="88" fill="#fff" font-family="Arial" font-size="34" font-weight="900">12.480 ms</text><text x="24" y="120" fill="#9fb1c9" font-family="Arial" font-size="16">Nota armazenada como dado</text></g><g transform="translate(328 145)"><rect width="245" height="145" rx="18" fill="#10132f" stroke="#8a6cff"/><text x="24" y="38" fill="#c9b9ff" font-family="monospace" font-size="17">JULGAMENTO</text><text x="24" y="88" fill="#55ff9a" font-family="Arial" font-size="34" font-weight="900">PERFEITO</text><text x="24" y="120" fill="#9fb1c9" font-family="Arial" font-size="16">Diferença dentro da janela</text></g><g transform="translate(598 145)"><rect width="245" height="145" rx="18" fill="#241026" stroke="#ff6fab"/><text x="24" y="38" fill="#ffb0d1" font-family="monospace" font-size="17">PRECISÃO</text><text x="24" y="88" fill="#fff" font-family="Arial" font-size="34" font-weight="900">94%</text><text x="24" y="120" fill="#9fb1c9" font-family="Arial" font-size="16">Acertos × erros avaliados</text></g><g transform="translate(58 330)"><rect width="785" height="150" rx="20" fill="#050b16" stroke="#315070"/><text x="28" y="38" fill="#ffc857" font-family="monospace" font-size="18" font-weight="800">MODO ACESSÍVEL</text><text x="28" y="75" fill="#f4f8ff" font-family="Arial" font-size="23" font-weight="800">Notas maiores · velocidade visual reduzida · janela ampliada</text><text x="28" y="112" fill="#aebdd2" font-family="Arial" font-size="18">A acessibilidade altera parâmetros da própria simulação, não apenas a aparência.</text></g></svg>
