<!doctype html><html><body style='margin:0'><canvas id='game3d' style='width:800px;height:500px;display:block'></canvas><div id='move-joystick'></div><div id='move-stick'></div><button id='jump-button'></button><button id='run-button'></button><pre id='out'>booting</pre><script type='module'>
import {createLobbyState} from './lobby/assets/core/lobby-state.js?v=14.10.8.65-stage34-f63a';
import {createWorldManager} from './lobby/assets/core/world-manager.js?v=14.10.8.65-stage34-f63a';
import {CAMPUS_WORLD_ADAPTER} from './lobby/assets/core/world-adapter.js?v=14.10.8.65-stage34-f63a';
const zones=[
{key:'1ds',code:'1DS-A-MANHA',label:'1DS',name:'1ª Série DS',accent:'#36d2ff',portal:{label:'Laboratório 1DS'}},
{key:'2ds',code:'2DS-A-MANHA',label:'2DS',name:'2ª Série DS',accent:'#51e7a3',portal:{label:'Laboratório 2DS'}},
{key:'3ds',code:'3DS-C-MANHA',label:'3DS',name:'3ª Série DS',accent:'#b58cff',portal:{label:'Laboratório 3DS'}},
{key:'sub',code:'DS-SUB-NOITE',label:'SUB',name:'DS Subsequente',accent:'#ffae63',portal:{label:'Laboratório SUB'}}];
const state=createLobbyState({session:{user:{id:'u1'},profile:{role:'teacher',full_name:'Teste'},currentClass:{code:'3DS-C-MANHA'},classes:[],others:[]},world:{player:{x:800,y:500,area:'central'}}});
let first=false; window.errors=[]; addEventListener('error',e=>{errors.push('error:'+e.message);document.querySelector('#out').textContent=errors.join('\n')}); addEventListener('unhandledrejection',e=>{errors.push('rej:'+String(e.reason?.stack||e.reason));document.querySelector('#out').textContent=errors.join('\n')});
try{
 const manager=createWorldManager({worldState:state.world});
 const rt=await manager.start({adapter:CAMPUS_WORLD_ADAPTER,mode:'3d',context:{canvas:document.querySelector('#game3d'),zones,state,isStaff:()=>true,className:()=>'',onPlayerState:()=>{},onQualityChange:()=>{},onPerf:()=>{},onError:m=>errors.push('onError:'+m),onAreaChange:()=>{},onFirstFrame:()=>{first=true;document.querySelector('#out').textContent='FIRST_FRAME'},onInteriorChange:()=>{},onContextLost:()=>{},initialQuality:'low'}});
 const entered=rt.enterToolInterior?.('lab-virtual')===true;
 window.rt=rt;window.worldManager=manager;document.querySelector('#out').textContent=entered?'INTERIOR_CREATED':'INTERIOR_FAILED';setTimeout(()=>{window.SMOKE_READY=true;document.querySelector('#out').textContent=(first&&entered&&!errors.length?'PASS':!first?'NO_FIRST':!entered?'NO_INTERIOR':'FAIL')+'\n'+errors.join('\n')},2500);
}catch(e){document.querySelector('#out').textContent='THREW:'+String(e.stack||e)}
</script></body></html>
