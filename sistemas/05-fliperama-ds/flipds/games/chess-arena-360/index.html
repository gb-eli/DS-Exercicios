<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chess Arena 360 · Fliperama DS</title><link rel="stylesheet" href="./style.css"></head><body>
<main class="app"><canvas id="scene" aria-label="Tabuleiro tridimensional de xadrez"></canvas>
<header class="hud"><div class="brand"><span class="eyebrow">ESTRATÉGIA 3D · XADREZ COMPLETO</span><h1>Chess Arena 360</h1><p id="status">Brancas jogam</p></div><div class="score"><div><b id="turn">BRANCAS</b><span>TURNO</span></div><div><b id="state">NORMAL</b><span>ESTADO</span></div><div><b id="moves">0</b><span>LANCES</span></div></div></header>
<section class="panel"><div class="row"><label>Modo<select id="mode"><option value="local">2 jogadores locais</option><option value="cpu-iniciante">CPU · Iniciante</option><option value="cpu-normal">CPU · Normal</option><option value="cpu-estrategica">CPU · Estratégica</option><option value="cpu-mestre">CPU · Mestre</option></select></label><button id="camera">Visão superior</button><button id="new">Nova partida</button></div><div class="history"><strong>Histórico</strong><div id="history"></div></div><p class="help">Clique/toque: selecionar e mover · arraste: orbitar câmera · roda/pinça: zoom · C: câmera · N: nova partida</p></section>
<div id="promotion" class="modal" hidden><div><span>PROMOÇÃO</span><h2>Escolha a nova peça</h2><div class="promos"><button data-p="q">♛ Dama</button><button data-p="r">♜ Torre</button><button data-p="b">♝ Bispo</button><button data-p="n">♞ Cavalo</button></div></div></div>
<div id="result" class="modal" hidden><div><span id="resultBadge"></span><h2 id="resultTitle"></h2><p id="resultText"></p><button id="again">Nova partida</button></div></div>
</main><script src="./engine.js"></script><script src="./ai.js"></script><script type="module" src="./game.js"></script></body></html>
