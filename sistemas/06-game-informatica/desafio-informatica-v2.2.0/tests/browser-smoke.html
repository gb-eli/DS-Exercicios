<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>EduAuth Browser Smoke</title></head>
<body><h1>EduAuth Browser Smoke</h1><canvas id="qr"></canvas><pre id="result">RUNNING</pre>
<script type="module">
const out=document.querySelector('#result');
const checks=[];const check=(name,ok,detail='')=>{checks.push({name,ok:Boolean(ok),detail});if(!ok)throw new Error(name+': '+detail)};
try{
  await new Promise(resolve=>{const req=indexedDB.deleteDatabase('agv-edu-profiles');req.onsuccess=req.onerror=req.onblocked=()=>resolve()});
  await new Promise(resolve=>{const req=indexedDB.deleteDatabase('eduauth-offline-audit');req.onsuccess=req.onerror=req.onblocked=()=>resolve()});
  sessionStorage.clear();localStorage.clear();
  const storage=await import('../assets/js/storage.js?v=test');
  const core=await import('../assets/js/eduauth/core.js?v=test');
  const authStore=await import('../assets/js/eduauth/storage.js?v=test');
  const {renderQrToCanvas}=await import('../assets/js/eduauth/qr-code.js?v=test');
  await storage.initializeStorage();
  const profile=await storage.createProtectedProfile({name:'Aluno Teste',classId:'1ADM',password:'senha-teste-123'});
  check('perfil criado',profile?.name==='Aluno Teste');
  storage.saveLessonProgress('1ADM-01',{stageIndex:2,completed:false});await storage.flushStorage();
  const pkg=await storage.exportActiveProfilePackage();
  check('perfil usa envelope v2',pkg.record.formatVersion===2&&pkg.record.crypto?.passwordEnvelope&&pkg.record.crypto?.recoveryEnvelope);
  const recovery=await storage.exportProfileRecoveryEnvelope(pkg.record.id);
  check('pacote de recuperação sem senha',recovery.kind==='eduauth-profile-recovery-envelope'&&!JSON.stringify(recovery).includes('senha-teste-123'));
  await storage.lockActiveProfile();
  let wrong=false;try{await storage.unlockProtectedProfile(pkg.record.id,'senha-errada')}catch{wrong=true}check('senha errada rejeitada',wrong);
  await storage.unlockProtectedProfile(pkg.record.id,'senha-teste-123');
  check('progresso persistido',storage.getLessonProgress('1ADM-01')?.stageIndex===2);
  const request=await core.createRequest({actionId:'early-completion',classId:'1ADM',lessonId:'diagnostico',activityId:'diagnostic-class',resourceId:'diagnostico',profileId:pkg.record.id});
  authStore.savePendingRequest(request);check('solicitação em sessionStorage',authStore.getPendingRequest('early-completion','diagnostico')?.code===request.code);
  for(let i=0;i<5;i++)authStore.incrementAttempt('early-completion','diagnostico');check('limite de tentativas contabilizado',authStore.remainingAttempts(authStore.getPendingRequest('early-completion','diagnostico'))===0);
  const authorization=authStore.consumeRequest(request);check('autorização limitada',authorization.actionId==='early-completion'&&authorization.resourceId==='diagnostico');
  const qr=renderQrToCanvas(document.querySelector('#qr'),request.code,{size:180});check('QR offline renderizado',qr.modules>20&&document.querySelector('#qr').width>100);
  const vectors=await (await fetch('../eduauth/eduauth-test-vectors.json')).json();const signed=vectors.vectors.find(v=>v.id==='signed-valid');
  const verified=await core.verifySignedGrant(signed.token,{platformId:signed.payload.platformId,actionId:signed.payload.actionId,resourceIdHash:signed.payload.resourceIdHash,sessionId:signed.payload.sessionId});check('grant assinado verificado',verified.valid);
  await storage.deleteProtectedProfile(pkg.record.id,'senha-teste-123');
  out.textContent=JSON.stringify({status:'PASS',checks},null,2);document.body.dataset.status='PASS';
}catch(error){out.textContent=JSON.stringify({status:'FAIL',message:error.message,stack:error.stack,checks},null,2);document.body.dataset.status='FAIL'}
</script></body></html>
