<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loja Virtual DS</title>
  <script>
    (() => {
      const path = window.location.pathname;
      const repoBase = path.endsWith('/') ? path : path.slice(0, path.lastIndexOf('/') + 1);
      window.location.replace(new URL('demo/index.html', window.location.origin + repoBase));
    })();
  </script>
</head>
<body></body>
</html>
