<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Reparar Campus DS 3D • AGV Education Core</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#05080d;color:#edf7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 20%,#0d3340 0,transparent 33%),radial-gradient(circle at 80% 10%,#1b1744 0,transparent 30%),#05080d}.card{width:min(760px,100%);border:1px solid #1e5060;background:rgba(7,14,22,.94);box-shadow:0 28px 100px #000a;border-radius:22px;overflow:hidden}.head{padding:24px 26px;border-bottom:1px solid #18323d;background:linear-gradient(135deg,rgba(34,211,238,.11),rgba(139,92,246,.08))}.eyebrow{margin:0 0 8px;color:#67e8f9;font-size:.75rem;font-weight:800;letter-spacing:.15em;text-transform:uppercase}h1{margin:0;font-size:clamp(1.55rem,4vw,2.4rem)}.sub{color:#a9bac7;line-height:1.55;margin:10px 0 0}.body{padding:24px 26px}.status{display:grid;gap:10px;margin:0 0 18px}.row{display:grid;grid-template-columns:minmax(150px,.7fr) 1.3fr;gap:14px;padding:12px 14px;border-radius:12px;background:#0b141d;border:1px solid #172a36}.row span{color:#8fa6b5}.row strong{word-break:break-word}.ok{color:#86efac}.bad{color:#fca5a5}.wait{color:#fde68a}pre{max-height:250px;overflow:auto;white-space:pre-wrap;background:#03070b;border:1px solid #152732;border-radius:12px;padding:14px;color:#b7cbd7;font-size:.78rem}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}button,a.btn{appearance:none;border:1px solid #245266;border-radius:12px;background:#0c1a24;color:#eafaff;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none}.primary{background:#0e7490!important;border-color:#22d3ee!important}.hidden{display:none!important}@media(max-width:600px){body{padding:12px}.head,.body{padding:20px}.row{grid-template-columns:1fr;gap:5px}}
</style>
</head>
<body>
<main class="card">
  <header class="head"><p class="eyebrow">AGV Education Core • Recovery Utility</p><h1>Reparar Campus DS 3D</h1><p class="sub">Remove somente o Service Worker e os caches do Lobby, verifica se a release 14.10.8.40 foi realmente publicada e reabre o Campus com uma carga limpa.</p></header>
  <section class="body">
    <div id="status" class="status"></div>
    <pre id="log" aria-live="polite">Preparando reparo…</pre>
    <div class="actions"><button id="retry" type="button">Executar novamente</button><a id="open" class="btn primary hidden" href="lobby/?diag=1&v=14.10.8.40">Abrir Campus limpo</a></div>
  </section>
</main>
<script>
(()=>{
'use strict';
const RELEASE='14.10.8.40';
const logEl=document.getElementById('log'), statusEl=document.getElementById('status'), openEl=document.getElementById('open');
const logs=[];
const log=(m)=>{logs.push(`[${new Date().toLocaleTimeString()}] ${m}`);logEl.textContent=logs.join('\n')};
const row=(k,v,cls='')=>`<div class="row"><span>${k}</span><strong class="${cls}">${v}</strong></div>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function clearLobbyState(){
  let unregistered=0,deleted=0;
  if('serviceWorker' in navigator){
    const regs=await navigator.serviceWorker.getRegistrations();
    for(const reg of regs){
      if(new URL(reg.scope).pathname.includes('/DS-Exercicios/lobby/')||new URL(reg.scope).pathname.endsWith('/lobby/')){
        if(await reg.unregister())unregistered++;
      }
    }
  }
  if('caches' in window){
    for(const key of await caches.keys()){
      if(key.startsWith('agv-lobby-runtime-')){if(await caches.delete(key))deleted++;}
    }
  }
  return {unregistered,deleted};
}
async function probe(path,needle){
  const url=new URL(path,location.href);url.searchParams.set('repairRelease',RELEASE);url.searchParams.set('_',Date.now()+Math.random());
  const res=await fetch(url.href,{cache:'no-store',headers:{'Cache-Control':'no-cache','Pragma':'no-cache'}});
  const text=await res.text();
  const ct=res.headers.get('content-type')||'';
  const htmlLike=/^\s*<!doctype|^\s*<html/i.test(text);
  const marker=needle?text.includes(needle):true;
  return {path,status:res.status,ok:res.ok&&!htmlLike&&marker,contentType:ct,bytes:text.length,marker,htmlLike};
}
async function run(){
  logs.length=0;openEl.classList.add('hidden');statusEl.innerHTML=row('Release esperada',RELEASE,'wait');
  try{
    log('Desregistrando Service Worker antigo do Lobby…');
    const cleared=await clearLobbyState();
    log(`Service Workers removidos: ${cleared.unregistered}; caches do Lobby apagados: ${cleared.deleted}.`);
    const targets=[['lobby/index.html',RELEASE],['lobby/assets/diagnostics.js',RELEASE],['lobby/assets/vendor-loader.js',RELEASE],['lobby/assets/boot.js',RELEASE],['lobby/assets/lobby.js',RELEASE],['lobby/sw.js',RELEASE]];
    const results=[];
    for(const [path,needle] of targets){log(`Verificando ${path}…`);results.push(await probe(path,needle));}
    const failed=results.filter(x=>!x.ok);
    statusEl.innerHTML=row('Release esperada',RELEASE,'ok')+row('Service Worker antigo',cleared.unregistered?'removido':'nenhum registro antigo encontrado','ok')+row('Caches do Lobby',`${cleared.deleted} removido(s)`,'ok')+row('Arquivos publicados',failed.length?`${results.length-failed.length}/${results.length}`:`${results.length}/${results.length} OK`,failed.length?'bad':'ok');
    for(const r of results)log(`${r.ok?'OK':'FALHA'} ${r.path} • HTTP ${r.status} • ${r.bytes} bytes • marker=${r.marker} • html=${r.htmlLike}`);
    if(failed.length){
      log('A release 14.10.8.40 ainda NÃO está publicada corretamente na raiz do GitHub Pages. Não redirecionarei para evitar recarregar a versão antiga.');
      return;
    }
    log('Publicação validada. O Campus pode ser reaberto com carga limpa.');
    openEl.href=`lobby/?diag=1&v=${RELEASE}&repair=${Date.now()}`;openEl.classList.remove('hidden');
    setTimeout(()=>{location.assign(openEl.href)},1200);
  }catch(error){statusEl.innerHTML+=row('Resultado','Falha no reparo','bad');log(`ERRO: ${error?.message||error}`);}
}
document.getElementById('retry').addEventListener('click',run);run();
})();
</script>
</body>
</html>
