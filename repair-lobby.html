<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Reparar Campus DS • AGV Education Core</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#05080d;color:#edf7ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#05080d}
.card{width:min(780px,100%);border:1px solid #1e5060;background:#07101a;border-radius:22px;overflow:hidden}
.head,.body{padding:24px 26px}.head{border-bottom:1px solid #18323d}h1{margin:0 0 8px}
.sub{color:#a9bac7;line-height:1.55}.status{display:grid;gap:10px;margin-bottom:18px}
.row{display:grid;grid-template-columns:minmax(180px,.75fr) 1.25fr;gap:14px;padding:12px 14px;border-radius:12px;background:#0b141d;border:1px solid #172a36}
.ok{color:#86efac}.bad{color:#fca5a5}.wait{color:#fde68a}
pre{max-height:320px;overflow:auto;white-space:pre-wrap;background:#03070b;border:1px solid #152732;border-radius:12px;padding:14px;color:#b7cbd7;font-size:.78rem}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
button,a{border:1px solid #245266;border-radius:12px;background:#0c1a24;color:#eafaff;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none}
.primary{background:#0e7490;border-color:#22d3ee}.hidden{display:none}
@media(max-width:600px){body{padding:12px}.head,.body{padding:20px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="card">
<header class="head">
<h1>Reparar Campus DS</h1>
<p class="sub">Remove somente caches/Service Worker do Lobby e verifica os arquivos obrigatórios da release 14.10.8.82 antes de abrir o Campus.</p>
</header>
<section class="body">
<div id="status" class="status"></div>
<pre id="log" aria-live="polite">Preparando…</pre>
<div class="actions">
<button id="retry">Executar novamente</button>
<a id="open" class="primary hidden" href="lobby/?diag=1&v=14.10.8.82">Abrir Campus limpo</a>
</div>
</section>
</main>
<script>
(()=>{
'use strict';
const RELEASE='14.10.8.82';
const logEl=document.getElementById('log'),statusEl=document.getElementById('status'),openEl=document.getElementById('open');
const logs=[];
const log=m=>{logs.push(`[${new Date().toLocaleTimeString()}] ${m}`);logEl.textContent=logs.join('\n')};
const row=(k,v,c='')=>`<div class="row"><span>${k}</span><strong class="${c}">${v}</strong></div>`;
async function clearLobby(){
 let sw=0,cache=0;
 if('serviceWorker' in navigator){
   for(const reg of await navigator.serviceWorker.getRegistrations()){
     const p=new URL(reg.scope).pathname;
     if(p.includes('/DS-Exercicios/lobby/')||p.endsWith('/lobby/')){if(await reg.unregister())sw++;}
   }
 }
 if('caches' in window){
   for(const key of await caches.keys()){
     if(key.startsWith('agv-lobby-') && await caches.delete(key))cache++;
   }
 }
 return{sw,cache};
}
async function probe(path,signatures=[]){
 const u=new URL(path,location.href);
 u.searchParams.set('repairRelease',RELEASE);
 u.searchParams.set('_',Date.now()+Math.random());
 const r=await fetch(u.href,{cache:'no-store',headers:{'Cache-Control':'no-cache','Pragma':'no-cache'}});
 const text=await r.text();
 const ct=r.headers.get('content-type')||'';
 const html=/^\s*<!doctype|^\s*<html/i.test(text);
 const sigOk=signatures.every(s=>text.includes(s));
 return{path,status:r.status,bytes:text.length,ct,ok:r.ok&&!html&&sigOk,html,sigOk};
}
async function run(){
 logs.length=0;openEl.classList.add('hidden');
 statusEl.innerHTML=row('Release esperada',RELEASE,'wait');
 try{
   const c=await clearLobby();
   log(`Service Workers removidos: ${c.sw}; caches removidos: ${c.cache}.`);
   const targets=[
     ['lobby/index.html',['14.10.8.82','solar-system-modal','deep-space-modal','deep-space-exploration','interplanetary-travel']],
     ['lobby/assets/boot.js',['14.10.8.82','world/dynamic-world.js']],
     ['lobby/assets/lobby.js',['14.10.8.82','RURAL_WORLD_ADAPTER','MILITARY_WORLD_ADAPTER','SPACE_WORLD_ADAPTER','MOON_WORLD_ADAPTER','MARS_WORLD_ADAPTER','PARQUE_WORLD_ADAPTER','INTERPLANETARY_CONSOLE','DEEP_SPACE_MISSIONS','startDeepSpaceMission','deep-space-runtime.js','moon-agv','mars-agv']],
     ['lobby/assets/core/world-adapter.js',['RURAL_WORLD_ADAPTER','MILITARY_WORLD_ADAPTER','SPACE_WORLD_ADAPTER','MOON_WORLD_ADAPTER','MARS_WORLD_ADAPTER','PARQUE_WORLD_ADAPTER','space3d.js?v=14.10.8.82-stage51-parque-connected','moon3d.js?v=14.10.8.82-stage51-parque-connected','mars3d.js?v=14.10.8.82-stage51-parque-connected','parque-diversoes-agv3d.js?v=14.10.8.82-stage51-parque-connected']],
     ['lobby/assets/world/rural-world.js',['RURAL_BOUNDS','RURAL_FAST_TRAVEL','RURAL_ANIMALS','rural-agv']],
     ['lobby/assets/rural-lite.js',['createRuralLite','rural-agv','RURAL_FAST_TRAVEL']],
     ['lobby/assets/rural3d.js',['createRural3D','rural-world-streamed-f72','renderer.dispose']],
     ['lobby/assets/world/space-world.js',['SPACE_BOUNDS','SPACE_FAST_TRAVEL','SPACE_MODULES','INTERPLANETARY_CONSOLE','space-agv']],
     ['lobby/assets/space-lite.js',['createSpaceLite','space-agv','SPACE_FAST_TRAVEL','INTERPLANETARY_CONSOLE','setInputLocked']],
     ['lobby/assets/space3d.js',['createSpace3D','space-world-streamed-f77','renderer.dispose','Earth','INTERPLANETARY_CONSOLE','setInputLocked']],
     ['lobby/assets/world/solar-system.js',['SOLAR_SYSTEM_BODIES','SOLAR_DESTINATIONS','ASTEROID_BELT','SOLAR_TRAVEL_PHASES']],
     ['lobby/assets/world/deep-space-exploration.js',['DEEP_SPACE_CONSOLE','SPACE_TELESCOPE','DEEP_SPACE_MISSIONS','TELESCOPE_TARGETS']],
     ['lobby/assets/deep-space-runtime.js',['createDeepSpaceRuntime','setVirtualControl','addAsteroids','addJupiter','addSaturn']],
     ['lobby/assets/parque-diversoes-agv-lite.js',['createParqueDiversoesLite','parque-diversoes-agv']],
     ['lobby/assets/parque-diversoes-agv3d.js',['createParqueDiversoes3D','parque-diversoes-agv']],
     ['lobby/assets/world/parque-diversoes-agv-shared.js',['PARQUE_WORLD_ID','PARQUE_RETURN_PORTAL','PARQUE_FAST_TRAVEL']],
     ['lobby/assets/world/moon-world.js',['MOON_GRAVITY','MOON_ROVER','MOON_FAST_TRAVEL']],
     ['lobby/assets/moon-lite.js',['createMoonLite','moon-agv','MOON_FAST_TRAVEL']],
     ['lobby/assets/moon3d.js',['createMoon3D','moon-world-streamed-f75','renderer.dispose','MOON_GRAVITY']],
     ['lobby/assets/world/mars-world.js',['MARS_GRAVITY','MARS_ROVER','MARS_CANYONS','MARS_FAST_TRAVEL']],
     ['lobby/assets/mars-lite.js',['createMarsLite','mars-agv','MARS_FAST_TRAVEL']],
     ['lobby/assets/mars3d.js',['createMars3D','mars-world-streamed-f76','renderer.dispose','MARS_GRAVITY','marsDustStorm']],
     ['lobby/assets/world/campus-destinations.js',['CAMPUS_DESTINATIONS','CAMPUS_TOOL_BUILDING_COLLIDERS']],
     ['lobby/assets/world/campus-city-network.js',['CAMPUS_ROAD_HIERARCHY','CAMPUS_THEME_PLAZAS','CAMPUS_VALE_MONUMENTAL_LINK']],
     ['lobby/assets/world/campus-interiors.js',['CAMPUS_INTERIOR_PROFILES','CAMPUS_INTERIOR_MAP','CAMPUS_INTERIOR_INTERACTIONS']],
     ['lobby/assets/world/campus-live-systems.js',['CAMPUS_INTERIOR_LIVE_BLUEPRINTS','CAMPUS_GARAGE_FLEET','CAMPUS_STATION_LINKS','CAMPUS_VALE_CEREMONIAL_GATE']],
     ['lobby/assets/world/campus-mobility-systems.js',['CAMPUS_TRAFFIC_ROUTES','CAMPUS_DRIVABLE_VEHICLES','CAMPUS_TRAFFIC_SIGNALS','CAMPUS_SPEED_ZONES','resolveTrafficSignalState']],
     ['lobby/assets/world/cinema-media.js',['EMPTY_CINEMA_MEDIA','classifyCinemaSource','normalizeCinemaMedia','cinemaSourceLabel']],
     ['lobby/assets/world/security-cameras.js',['CAMPUS_SECURITY_CAMERAS','CAMPUS_SECURITY_CAMERA_MAP','securityCameraZoomFov']],
     ['lobby/assets/world/aerial-mobility.js',['CAMPUS_HELIPADS','CAMPUS_AERIAL_VEHICLES','aerialSpeedKmh']],
     ['lobby/assets/world/campus-viewpoints.js',['CAMPUS_VIEWPOINTS','CAMPUS_VIEWPOINT_LANDMARKS','viewpointZoomFov']],
     ['lobby/assets/world/campus-connections.js',['CAMPUS_CONNECTIONS','CAMPUS_SKYBRIDGES']],
     ['lobby/assets/world/dynamic-world.js',['resolveWorldTime','WORLD_TIME_MODES','skyPalette']],
     ['lobby/sw.js',['14.10.8.82','stage51-parque-connected']]
   ];
   const rs=[];
   for(const [p,sigs] of targets){log(`Verificando ${p}…`);rs.push(await probe(p,sigs));}
   const bad=rs.filter(x=>!x.ok);
   rs.forEach(x=>log(`${x.ok?'OK':'FALHA'} ${x.path} • HTTP ${x.status} • ${x.bytes} bytes • ${x.ct}`));
   statusEl.innerHTML=
     row('Release',RELEASE,bad.length?'bad':'ok')+
     row('Service Worker antigo',`${c.sw} removido(s)`,'ok')+
     row('Caches Lobby',`${c.cache} removido(s)`,'ok')+
     row('Arquivos obrigatórios',`${rs.length-bad.length}/${rs.length}`,bad.length?'bad':'ok');
   if(bad.length){log('Ainda existe arquivo obrigatório ausente/incorreto na publicação.');return;}
   log('Publicação íntegra. O Campus pode ser aberto com carga limpa.');
   openEl.href=`lobby/?diag=1&v=${RELEASE}&repair=${Date.now()}`;
   openEl.classList.remove('hidden');
 }catch(e){
   statusEl.innerHTML+=row('Resultado','Falha no reparo','bad');
   log(`ERRO: ${e?.message||e}`);
 }
}
document.getElementById('retry').addEventListener('click',run);
run();
})();
</script>
</body>
</html>
