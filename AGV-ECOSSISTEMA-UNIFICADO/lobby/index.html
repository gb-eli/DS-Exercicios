<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data:; connect-src 'self' https://iresvqwyaqotghjssncg.supabase.co wss://iresvqwyaqotghjssncg.supabase.co; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'">
  <title>AGV — Lobby DS</title>
  <link rel="stylesheet" href="assets/lobby.css">
</head>
<body>
  <section id="login" class="login-shell">
    <article class="login-card">
      <p class="eyebrow">AGV Education Core</p>
      <h1>Lobby DS</h1>
      <p class="muted">Entre no campus virtual. Você pode circular pelas quatro áreas; as atividades só abrem quando o professor liberar.</p>
      <form id="login-form" class="stack">
        <label>E-mail institucional<input id="email" type="email" autocomplete="username" required placeholder="aluno@escola.pr.gov.br"></label>
        <label>Senha <small>no primeiro acesso do aluno, use o CGM</small><input id="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">Entrar no lobby</button>
      </form>
      <p id="login-message" class="message" aria-live="polite"></p>
    </article>
  </section>

  <main id="game-shell" class="game-shell hidden">
    <header class="hud-top">
      <div><p class="eyebrow">Lobby Geral</p><strong id="player-name">Aluno</strong><span id="player-class" class="chip">—</span></div>
      <div class="hud-status"><span id="area-label">Praça Central</span><span id="online-count" class="chip">1 online</span><button id="logout" class="ghost" type="button">Sair</button></div>
    </header>

    <section class="game-stage">
      <canvas id="game" width="1600" height="1000" aria-label="Lobby virtual com quatro áreas de turma"></canvas>
      <div id="interaction" class="interaction hidden"><strong id="interaction-title"></strong><span id="interaction-text"></span><button id="interaction-button" class="primary" type="button">Interagir</button></div>
      <div id="toast" class="toast hidden" aria-live="polite"></div>
      <div id="activity-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="activity-title">
        <div class="modal-card">
          <button id="activity-close" class="modal-close" type="button" aria-label="Fechar">×</button>
          <p class="eyebrow">Portal de Atividades</p>
          <h2 id="activity-title">Atividades liberadas</h2>
          <p id="activity-subtitle" class="muted"></p>
          <div id="activity-list" class="activity-list"></div>
        </div>
      </div>
    </section>

    <footer class="hud-bottom">
      <div class="help"><strong>Movimento</strong><span>WASD / setas</span><strong>Interagir</strong><span>E ou Enter</span><strong>Emote</strong><span>1 👋 · 2 👍 · 3 ✨</span></div>
      <div class="emotes"><button data-emote="wave" type="button">👋</button><button data-emote="like" type="button">👍</button><button data-emote="spark" type="button">✨</button></div>
      <div class="touch-controls" aria-label="Controles de toque">
        <button data-key="ArrowUp" type="button">▲</button><div><button data-key="ArrowLeft" type="button">◀</button><button id="touch-action" type="button">E</button><button data-key="ArrowRight" type="button">▶</button></div><button data-key="ArrowDown" type="button">▼</button>
      </div>
    </footer>
  </main>
  <script type="module" src="assets/lobby.js"></script>
</body>
</html>
