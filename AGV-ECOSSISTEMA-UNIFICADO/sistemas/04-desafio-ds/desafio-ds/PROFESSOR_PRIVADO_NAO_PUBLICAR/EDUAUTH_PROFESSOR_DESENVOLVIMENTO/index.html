<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EduAuth Professor — Desenvolvimento</title><style>body{font-family:Arial,sans-serif;background:#07111f;color:#eef6ff;margin:0;padding:24px}.card{max-width:820px;margin:auto;background:#11233a;padding:24px;border-radius:18px}.warn{background:#6b3700;padding:12px;border-radius:12px;font-weight:bold}label{display:block;margin-top:14px;font-weight:bold}textarea,input{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;background:#07111f;color:white;border:1px solid #6381a3;border-radius:10px}button{padding:12px 16px;margin:14px 8px 0 0;border:0;border-radius:10px;font-weight:bold;cursor:pointer}.primary{background:#52e0b7}.secondary{background:#c8d8ea}.details{padding:12px;background:#07111f;border-radius:10px;margin-top:14px;line-height:1.7}.qr{background:white;padding:12px;width:max-content;max-width:100%;margin-top:16px;border-radius:12px}.qr svg{max-width:100%;height:auto}</style><body><main class="card"><h1>EduAuth Professor</h1><p class="warn">AMBIENTE DE DESENVOLVIMENTO. As chaves deste validador são apenas para testes e não podem ser usadas em atividade real.</p><label>Código-base da plataforma<textarea id="base" rows="4" placeholder="EA1-C1-K01-..."></textarea></label><label>Motivo para autorização assinada<textarea id="reason" rows="2">Autorização do professor para teste de integração.</textarea></label><button id="generate" class="primary">Interpretar e gerar</button><div id="details" class="details">Aguardando código-base.</div><label id="resultLabel">Resultado</label><textarea id="result" rows="5" readonly></textarea><button id="copy" class="secondary">Copiar resultado</button><p id="status"></p><div id="qr" class="qr"></div></main><script src="qrcode-browser.js"></script><script src="validator-config.js"></script><script src="eduauth-validator.js"></script></body></html>
