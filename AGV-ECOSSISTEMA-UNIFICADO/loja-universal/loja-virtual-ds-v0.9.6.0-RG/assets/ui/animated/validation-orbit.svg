<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" >
<defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".55" stop-color="#0d1c32"/><stop offset="1" stop-color="#070914"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2ad7ff"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef8ff"/><stop offset=".24" stop-color="#7b91a8"/><stop offset=".52" stop-color="#24364a"/><stop offset=".78" stop-color="#9bb0c2"/><stop offset="1" stop-color="#263546"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#2ad7ff" stop-opacity=".65"/><stop offset="1" stop-color="#2ad7ff" stop-opacity="0"/></radialGradient>
