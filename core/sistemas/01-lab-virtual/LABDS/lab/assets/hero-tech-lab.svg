<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
  <title id="title">Painel tecnológico do Laboratório Virtual DS</title>
  <desc id="desc">Computador, terminal, rede de dados e módulos de tecnologia em uma composição vetorial.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08172a"/><stop offset=".55" stop-color="#0c2740"/><stop offset="1" stop-color="#092f34"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6ee7ff"/><stop offset="1" stop-color="#19d3ae"/></linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b7cff"/><stop offset="1" stop-color="#4ad7ff"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="15" result="blur"/><feOffset dy="16" result="offset"/><feFlood flood-color="#00111c" flood-opacity=".6" result="color"/><feComposite in="color" in2="offset" operator="in" result="shadowColor"/><feMerge><feMergeNode in="shadowColor"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#56d7ff" stroke-opacity=".08"/></pattern>
  </defs>
  <rect x="12" y="12" width="736" height="596" rx="46" fill="url(#bg)" stroke="#78eaff" stroke-opacity=".22"/>
  <rect x="12" y="12" width="736" height="596" rx="46" fill="url(#grid)"/>
  <circle cx="620" cy="100" r="110" fill="#15d5ba" opacity=".08"/><circle cx="112" cy="500" r="150" fill="#735cff" opacity=".08"/>
  <g stroke="#5ce5ff" stroke-opacity=".28" fill="none" stroke-width="2">
    <path d="M40 130H150l30-30h110"/><path d="M470 86h120l32 36h96"/><path d="M32 476h126l48 48h120"/><path d="M514 522h120l28-28h58"/>
  </g>
  <g fill="#62ffe0" filter="url(#glow)"><circle cx="40" cy="130" r="4"/><circle cx="290" cy="100" r="4"/><circle cx="718" cy="122" r="4"/><circle cx="32" cy="476" r="4"/><circle cx="326" cy="524" r="4"/><circle cx="718" cy="494" r="4"/></g>

  <g filter="url(#shadow)">
    <rect x="112" y="132" width="470" height="324" rx="28" fill="#07111e" stroke="#4ad9f6" stroke-opacity=".48"/>
    <rect x="130" y="152" width="434" height="270" rx="18" fill="#050b14" stroke="#244c69"/>
    <rect x="130" y="152" width="434" height="42" rx="18" fill="#10243a"/>
    <circle cx="154" cy="173" r="7" fill="#ff6b79"/><circle cx="177" cy="173" r="7" fill="#ffd15c"/><circle cx="200" cy="173" r="7" fill="#5be7a4"/>
    <rect x="228" y="164" width="168" height="18" rx="9" fill="#17364d"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <text x="158" y="230" fill="#64f2b7">student@labds:~$</text><text x="380" y="230" fill="#d8f6ff">python app.py</text>
      <text x="158" y="266" fill="#88abc0">Inicializando ambiente...</text>
      <text x="158" y="302" fill="#75d8ff">[OK]</text><text x="208" y="302" fill="#d8f6ff">rede neural carregada</text>
      <text x="158" y="338" fill="#75d8ff">[OK]</text><text x="208" y="338" fill="#d8f6ff">banco conectado</text>
      <text x="158" y="374" fill="#64f2b7">›</text><text x="182" y="374" fill="#d8f6ff">laboratório pronto_</text>
    </g>
    <path d="M285 456h124l18 56H267z" fill="#122a40" stroke="#3d8eb4"/><rect x="222" y="510" width="250" height="24" rx="12" fill="#0d2134" stroke="#3d8eb4"/>
  </g>

  <g transform="translate(520 250)" filter="url(#shadow)">
    <path d="M0 38 66 0l66 38v76l-66 38L0 114z" fill="#10263d" stroke="#76e5ff" stroke-opacity=".7"/>
    <path d="M0 38 66 76l66-38M66 76v76" fill="none" stroke="#76e5ff" stroke-opacity=".62"/>
    <path d="M20 50 66 24l46 26-46 26z" fill="url(#violet)" opacity=".78"/>
    <circle cx="66" cy="76" r="10" fill="#75ffe3" filter="url(#glow)"/>
  </g>

  <g transform="translate(54 268)" filter="url(#shadow)">
    <rect width="108" height="108" rx="24" fill="#102238" stroke="#5ce5ff" stroke-opacity=".55"/>
    <path d="M30 62c10-26 38-34 55-12M31 76c16-12 36-12 52 0M42 88c8-6 16-6 24 0" fill="none" stroke="url(#cyan)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="54" cy="94" r="5" fill="#67f7d0"/>
  </g>

  <g transform="translate(574 420)" filter="url(#shadow)">
    <rect width="112" height="112" rx="26" fill="#102238" stroke="#78ffd7" stroke-opacity=".5"/>
    <path d="M56 24 88 42v36L56 96 24 78V42z" fill="none" stroke="url(#cyan)" stroke-width="4"/>
    <circle cx="56" cy="60" r="16" fill="#63e9ff" opacity=".18" stroke="#63e9ff"/>
    <path d="M56 44v32M40 60h32" stroke="#75ffd8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke="url(#cyan)" stroke-width="3" opacity=".8">
    <path d="M164 322h-30"/><path d="M582 318h34"/><path d="M450 456v32h92"/>
