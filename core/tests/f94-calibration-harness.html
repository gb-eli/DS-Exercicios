<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AGV World F94 — Harness de calibração</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#061017;color:#ecfbff}body{margin:0;padding:24px}.card{max-width:820px;margin:auto;padding:22px;border:1px solid #214858;border-radius:18px;background:#0a1b24;box-shadow:0 18px 60px #0008}h1{margin:0 0 8px;font-size:1.45rem}p{color:#a9c5cf;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}button,select{min-height:44px;border:1px solid #2c6577;border-radius:11px;background:#102c38;color:#effcff;padding:9px 12px;font-weight:750}button{cursor:pointer}button:hover{border-color:#67dffc}.result{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.metric{padding:12px;border-radius:12px;background:#07151d;border:1px solid #183845}.metric small,.metric strong{display:block}.metric small{color:#789ba8}.metric strong{margin-top:4px}pre{overflow:auto;max-height:360px;padding:14px;border-radius:12px;background:#03090d;color:#b8f1ff;font-size:.75rem}@media(max-width:680px){.grid,.result{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="card">
    <h1>F94 — Simulação da calibração gráfica</h1>
    <p>Harness sem WebGL para validar decisões, persistência e bloqueio manual. Não mede FPS real.</p>
    <div class="grid">
      <label>Aparelho<select id="device"><option value="phone">Android 4 GB / 4 núcleos</option><option value="desktop">Desktop 8 GB / 8 núcleos</option><option value="power">Desktop 16 GB / 12 núcleos</option></select></label>
      <label>Preferência<select id="preference"><option value="auto">Automático</option><option value="high">Alto manual</option></select></label>
      <label>Qualidade inicial<select id="quality"><option value="medium">Médio</option><option value="high">Alto</option><option value="ultra">Ultra</option></select></label>
    </div>
    <div class="grid">
      <button data-scenario="overload">Simular sobrecarga</button>
      <button data-scenario="stable">Simular estabilidade</button>
      <button data-scenario="memory">Simular pressão de memória</button>
    </div>
    <section class="result"><div class="metric"><small>Resultado</small><strong id="status">Aguardando</strong></div><div class="metric"><small>Recomendação</small><strong id="recommendation">—</strong></div><div class="metric"><small>Decisões</small><strong id="decisions">0</strong></div></section>
    <pre id="output">Selecione um cenário.</pre>
  </main>
  <script type="module">
    import {createGraphicsCalibrator,detectCalibrationDevice} from '../../lobby/assets/render/graphics-calibrator.js?v=14.10.8.96-f94-auto-calibration';
    const $=id=>document.getElementById(id),profiles={phone:{deviceMemory:4,hardwareConcurrency:4,coarse:true,width:412},desktop:{deviceMemory:8,hardwareConcurrency:8,coarse:false,width:1440},power:{deviceMemory:16,hardwareConcurrency:12,coarse:false,width:1920}};
    function run(scenario){let now=1_000_000,preference=$('preference').value;const values=new Map(),storage={getItem:key=>values.get(key)||null,setItem:(key,value)=>values.set(key,value)},device=detectCalibrationDevice({...profiles[$('device').value],saveData:false,reducedMotion:false}),events=[],calibrator=createGraphicsCalibrator({storage,device,now:()=>now,getPreference:()=>preference,onRecommendation:event=>events.push(event)}),worldId='harness-f94';let quality=calibrator.initialQuality(worldId,$('quality').value);if(preference!=='auto')calibrator.noteQuality(worldId,$('quality').value,{manual:true});
      const config=scenario==='stable'?{fps:60,frameTimeMs:16.67,count:55}:scenario==='memory'?{fps:48,frameTimeMs:21,count:8,estimatedGpuMemoryMb:900,jsHeapUsedMb:940,jsHeapLimitMb:1000}:{fps:14,frameTimeMs:72,count:8};let last;
      for(let index=0;index<config.count;index++){now+=1000;last=calibrator.sample({worldId,quality:events.at(-1)?.quality||quality,...config});}
      const summary=calibrator.getSummary(worldId);$('status').textContent=last?.status||last?.reason||'sem alteração';$('recommendation').textContent=events.at(-1)?.quality||summary.quality||quality;$('decisions').textContent=String(events.length);$('output').textContent=JSON.stringify({scenario,device:calibrator.getDevice(),preference,events,summary},null,2);
    }
    document.querySelectorAll('[data-scenario]').forEach(button=>button.onclick=()=>run(button.dataset.scenario));
  </script>
</body>
</html>
