<!doctype html>
<meta charset="utf-8">
<title>Teste ZIP — AGV Reference Patch</title>
<script src="../assets/js/reference-workspace.js"></script>
<button id="run">Gerar ZIP de teste</button>
<pre id="out"></pre>
<script>
document.querySelector('#run').onclick = () => {
  const blob = AGVReferenceWorkspacePatch.createStoreZip([
    { filename: 'index.html', content: '<h1>Teste</h1>' },
    { filename: 'script.js', content: 'console.log("ok")' }
  ]);
  document.querySelector('#out').textContent = `ZIP criado: ${blob.size} bytes`;
};
</script>
